<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body style="margin: 0; overflow: hidden; position: relative;">
    <button id="generate-btn"
        style="position: absolute; top: 20px; left: 20px; padding: 10px 20px; z-index: 1000; background-color: blue; color: white; border: none; cursor: pointer;">
        Send Random Ride Request
    </button>
    <canvas id="canvas"></canvas>

    <div id="sidebar"
        style="position: absolute; right: 0; top: 0; width: 350px; height: 100vh; background: #ffffff; border-left: 2px solid #ccc; overflow-y: auto; padding: 20px; box-sizing: border-box; font-family: sans-serif; z-index: 1000; box-shadow: -2px 0 10px rgba(0,0,0,0.1);">
        <h2 style="margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; color: #333;">Matched Pods &
            Rides</h2>
        <div id="pods-list" style="display: flex; flex-direction: column; gap: 10px;">
            <!-- Pod items will be appended here -->
        </div>
    </div>

    <script src="./grapher.js" type="module"></script>

</body>

</html>
